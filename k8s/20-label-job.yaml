# Two parallel workers (Indexed Job): pod 0 -> SHARD_INDEX=0, pod 1 -> SHARD_INDEX=1.
# Teacher = Ollama on the laptop (OLLAMA_HOST=0.0.0.0 ollama serve), reached via host.k3d.internal.
apiVersion: batch/v1
kind: Job
metadata: {name: teacher-label, namespace: pipeline}
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: cmd-worker:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD_INDEX
              valueFrom: {fieldRef: {fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"}}
            - {name: SHARD_COUNT, value: "2"}
            - {name: OLLAMA_URL, value: "http://host.k3d.internal:11434"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-creds, key: S3_ACCESS_KEY}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: s3-creds, key: S3_SECRET_KEY}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
